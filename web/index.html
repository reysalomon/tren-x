<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <meta name="description" content="FormCoach AI — отырып-тұру техникасын видео арқылы тексеру · проверка техники приседаний по видео">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FormCoach">
  <title>FormCoach AI</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ============ Экран 1: главная ============ -->
  <main id="screen-home" class="screen active">
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span>FormCoach<span class="brand-ai">AI</span></div>
      <div class="top-right">
        <div class="lang-switch" role="group" aria-label="Тіл / Язык">
          <button type="button" data-lang="kk">ҚАЗ</button><button type="button" data-lang="ru">РУС</button>
        </div>
        <button class="install-btn" id="btn-install" hidden data-i18n="install">Орнату</button>
      </div>
    </header>

    <section class="hero">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="hero_title" data-i18n-ex></h1>
      <p class="lead" data-i18n="hero_lead"></p>
    </section>

    <section class="ex-pick" aria-labelledby="ex-title">
      <p class="eyebrow" id="ex-title" data-i18n="ex_title"></p>
      <div class="lang-switch lang-switch-big" role="group" aria-labelledby="ex-title">
        <button type="button" data-ex="squat" data-i18n="ex_squat"></button><button type="button" data-ex="deadlift" data-i18n="ex_deadlift"></button>
      </div>
    </section>

    <section class="actions">
      <button class="btn btn-primary btn-live" id="btn-live">
        <span class="live-dot" aria-hidden="true"></span>
        <span class="btn-live-text"><b data-i18n="live_btn"></b><small data-i18n="live_sub"></small></span>
      </button>
      <p class="or" data-i18n="or_upload"></p>
      <div class="actions-row">
        <label class="btn btn-secondary">
          <input id="input-camera" type="file" accept="video/*" capture="environment" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h8A2.5 2.5 0 0 1 16 7.5v1.2l3.6-2.1A1 1 0 0 1 21 7.5v9a1 1 0 0 1-1.4.9L16 15.3v1.2a2.5 2.5 0 0 1-2.5 2.5h-8A2.5 2.5 0 0 1 3 16.5z"/></svg>
          <span data-i18n="btn_camera"></span>
        </label>
        <label class="btn btn-secondary">
          <input id="input-gallery" type="file" accept="video/*" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 12.5V18h14v-2.2l-4-4.3-3.2 3.4-2.3-2.4zM8.5 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg>
          <span data-i18n="btn_gallery"></span>
        </label>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title" data-i18n="how_title"></h2>
      <ol class="tips">
        <li><span data-i18n="tip1"></span></li>
        <li><span data-i18n="tip2" data-i18n-ex></span></li>
        <li><span data-i18n="tip3"></span></li>
        <li><span data-i18n="tip4"></span></li>
      </ol>
    </section>

    <section class="card">
      <h2 class="card-title" data-i18n="demo_title"></h2>
      <p class="muted" data-i18n="demo_text"></p>
      <div class="chips" id="demo-chips"></div>
      <button class="btn btn-ghost" id="btn-demo" data-i18n="btn_demo"></button>
    </section>

    <p class="footnote" data-i18n="privacy"></p>
  </main>

  <!-- ============ Экран 2: результат ============ -->
  <main id="screen-result" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-go="home" data-i18n-aria="to_home">
        <svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg>
      </button>
      <div class="topbar-title" data-i18n="result"></div>
      <span class="icon-btn-spacer"></span>
    </header>

    <div id="result-empty" class="empty">
      <p data-i18n="result_empty"></p>
      <button class="btn btn-primary" data-go="home" data-i18n="btn_upload"></button>
    </div>

    <div id="result" hidden>
      <section class="score">
        <div class="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="52"/>
            <circle class="ring-fg" id="ring-fg" cx="60" cy="60" r="52"/>
          </svg>
          <div class="ring-text"><span id="score-good">0</span><small><span data-i18n="of_total"></span> <span id="score-total">0</span></small></div>
        </div>
        <div class="score-side">
          <p class="eyebrow" id="score-source"></p>
          <h2 id="score-headline">—</h2>
          <p class="muted" id="score-sub"></p>
        </div>
      </section>

      <section class="stats">
        <div class="stat"><span id="st-reps">0</span><small data-i18n="st_reps"></small></div>
        <div class="stat"><span id="st-bad">0</span><small data-i18n="st_bad"></small></div>
        <div class="stat"><span id="st-time">0</span><small data-i18n="st_time"></small></div>
      </section>

      <section class="card" id="top-advice-card">
        <h2 class="card-title" data-i18n="advice_title"></h2>
        <ul class="advice" id="top-advice"></ul>
      </section>

      <h2 class="section-title" data-i18n="reps_title"></h2>
      <section class="reps" id="reps"></section>

      <section class="card">
        <h2 class="card-title" id="chart-title"></h2>
        <div class="legend" id="legend"></div>
        <div class="chart" id="chart"></div>
        <p class="muted small" data-i18n="chart_note"></p>
      </section>

      <section class="card">
        <h2 class="card-title" data-i18n="coach_title"></h2>
        <ul class="timeline" id="feedback"></ul>
      </section>

      <p class="muted small center pad" id="ml-note"></p>
    </div>
  </main>

  <!-- ============ Экран 3: настройки ============ -->
  <main id="screen-settings" class="screen">
    <header class="topbar"><div class="topbar-title" data-i18n="settings"></div></header>
    <p class="muted pad" data-i18n="settings_note"></p>
    <section class="card">
      <h2 class="card-title" data-i18n="lang_title"></h2>
      <div class="lang-switch lang-switch-big" role="group" aria-label="Тіл / Язык">
        <button type="button" data-lang="kk">Қазақша</button><button type="button" data-lang="ru">Русский</button>
      </div>
    </section>
    <form id="settings-form" onsubmit="return false">
      <section class="card">
        <h2 class="card-title" data-i18n="rules_title"></h2>
        <div id="rules-ex"></div>
        <div id="rules-squat">
        <div class="field" data-key="max_thigh_angle" data-min="-10" data-max="70" data-step="1" data-unit="°"
             data-label="f_thigh" data-help="f_thigh_help"></div>
        <div class="field" data-key="max_torso_lean" data-min="15" data-max="70" data-step="1" data-unit="°"
             data-label="f_lean"></div>
        <div class="field" data-key="max_heel_lift" data-min="0.05" data-max="0.5" data-step="0.01" data-unit=""
             data-label="f_heel" data-help="f_heel_help"></div>
        <div class="field" data-key="min_rep_seconds" data-min="0.3" data-max="3" data-step="0.1" data-unit=" s"
             data-label="f_time" data-help="f_time_help"></div>
        </div>
      </section>
      <section class="card">
        <h2 class="card-title" data-i18n="phases_title"></h2>
        <div class="field" data-key="top_angle" data-min="140" data-max="180" data-step="1" data-unit="°"
             data-label="f_top"></div>
        <div class="field" data-key="bottom_angle" data-min="50" data-max="130" data-step="1" data-unit="°"
             data-label="f_bottom"></div>
        <div class="field" data-key="stay_prob" data-min="0.5" data-max="0.99" data-step="0.01" data-unit=""
             data-label="f_stay" data-help="f_stay_help"></div>
      </section>
      <button type="button" class="btn btn-ghost" id="btn-reset" data-i18n="btn_reset"></button>
    </form>
  </main>

  <!-- ============ Экран 4: как это работает ============ -->
  <main id="screen-about" class="screen">
    <header class="topbar"><div class="topbar-title" data-i18n="about"></div></header>
    <section class="pipeline">
      <div class="pipe-step" data-i18n="pipe_video"></div>
      <div class="pipe-step" data-i18n="pipe_pose"></div>
      <div class="pipe-step hl" data-i18n="pipe_hmm"></div>
      <div class="pipe-step hl" data-i18n="pipe_agent"></div>
      <div class="pipe-step hl" data-i18n="pipe_ml"></div>
    </section>

    <details class="card acc" open>
      <summary data-i18n="acc0_title"></summary>
      <p data-i18n="acc0_text"></p>
    </details>
    <details class="card acc">
      <summary data-i18n="acc7_title"></summary>
      <p data-i18n="acc7_text"></p>
      <div id="hmm-matrix"></div>
    </details>
    <details class="card acc">
      <summary data-i18n="acc1_title"></summary>
      <p data-i18n="acc1_text"></p>
    </details>
    <details class="card acc">
      <summary data-i18n="acc8_title"></summary>
      <p data-i18n="acc8_text"></p>
      <div id="models-table"></div>
    </details>
    <details class="card acc">
      <summary data-i18n="acc9_title"></summary>
      <p data-i18n="acc9_text"></p>
    </details>
    <p class="footnote"><span data-i18n="footer"></span> · <a href="https://github.com/reysalomon/formcoach-ai">GitHub</a></p>
  </main>

  <!-- ============ Живая камера ============ -->
  <main id="screen-live" class="live" hidden>
    <video id="live-video" playsinline muted autoplay></video>
    <canvas id="live-canvas"></canvas>
    <div class="live-top">
      <button class="live-icon" id="live-close" data-i18n-aria="live_close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7l-1.4-1.4L9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg>
      </button>
      <div class="live-count" aria-live="polite">
        <span id="live-reps">0</span>
        <small><span data-i18n="live_reps"></span> · <b id="live-good">0</b> <span data-i18n="live_good"></span></small>
      </div>
      <div class="live-side">
        <button class="live-icon" id="live-sound" data-i18n-aria="live_sound" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        </button>
        <button class="live-icon" id="live-flip" data-i18n-aria="live_flip">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 7.2 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4zm3 4.5a4.5 4.5 0 0 1 4.4 3.5H18l-2.5 3-2.5-3h1.3A2.5 2.5 0 0 0 12 10.5a2.5 2.5 0 0 0-1.8.8L8.8 9.9A4.5 4.5 0 0 1 12 8.5zm-4.5 3 2.5 3H8.7a2.5 2.5 0 0 0 5.1.7l1.4 1.4a4.5 4.5 0 0 1-8.4-2.1H5z"/></svg>
        </button>
      </div>
    </div>
    <div class="live-phase" id="live-phase" hidden></div>
    <div class="live-status" id="live-status" role="status" aria-live="polite"></div>
    <div class="live-hint" id="live-hint" aria-live="assertive" hidden></div>
    <div class="live-bottom">
      <button class="btn btn-primary live-finish" id="live-finish" data-i18n="live_finish" disabled></button>
    </div>
  </main>

  <!-- ============ Загрузка ============ -->
  <div id="loading" class="overlay" hidden>
    <div class="loader-card" role="status" aria-live="polite">
      <div class="pulse" aria-hidden="true"></div>
      <h2 id="load-title"></h2>
      <div class="bar"><div class="bar-fill" id="load-bar"></div></div>
      <ul class="steps" id="load-steps">
        <li data-step="0" data-i18n="step0"></li>
        <li data-step="1" data-i18n="step1"></li>
        <li data-step="2" data-i18n="step2"></li>
      </ul>
      <p class="muted small" data-i18n="load_note"></p>
    </div>
  </div>

  <div id="toast" class="toast" role="alert" hidden></div>

  <!-- ============ Нижнее меню ============ -->
  <nav class="tabbar">
    <button data-go="home" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 10v10a1 1 0 0 0 1 1h5v-6h6v6h5a1 1 0 0 0 1-1V10z"/></svg><span data-i18n="home_tab"></span></button>
    <button data-go="result"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h3v10zm6.5 0V4h3v16zM17 20v-7h3v7z"/></svg><span data-i18n="result"></span></button>
    <button data-go="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10a2.5 2.5 0 0 0 5 0h1V5h-1a2.5 2.5 0 0 0-5 0H4zm0 12h3a2.5 2.5 0 0 0 5 0h8v-2h-8a2.5 2.5 0 0 0-5 0H4zm0-6h9a2.5 2.5 0 0 0 5 0h2v-2h-2a2.5 2.5 0 0 0-5 0H4z"/></svg><span data-i18n="settings"></span></button>
    <button data-go="about"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg><span data-i18n="about_tab"></span></button>
  </nav>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script src="live.js"></script>
</body>
</html>
